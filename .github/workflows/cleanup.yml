name: 清理过期送货单Gist

on:
  schedule:
    - cron: '0 10 * * *'        # UTC 10:00 = 北京时间 18:00
  workflow_dispatch: {}          # 也可在 Actions 页面手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除过期 Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error, datetime, sys

          token = os.environ.get('GIST_TOKEN')
          if not token:
              print('未配置 GIST_TOKEN secret，跳过。')
              sys.exit(0)

          hdr = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'delivery-cleanup-action',
          }

          # 先列出用户 Gist；如果失败，给出明确提示（通常是 Token 缺 gist 权限）
          # 注意：/gists（GET）列出当前登录用户的 gists，classic PAT 与部分 fine-grained PAT 都支持
          list_url = 'https://api.github.com/gists?per_page=100'
          try:
              req = urllib.request.Request(list_url, headers=hdr)
              with urllib.request.urlopen(req) as resp:
                  gists = json.load(resp)
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='ignore')[:500]
              print('列出 Gist 失败：HTTP', e.code, e.reason)
              print('响应：', body)
              if e.code in (401, 403, 404):
                  print('提示：Token 权限不足。请重新生成 Personal Access Token（classic 类型），勾选 gist scope，然后更新仓库 GIST_TOKEN secret。')
                  print('      部署能成功只说明该 Token 能 POST /gists；cleanup 还需要 GET /gists 列表权限。')
              sys.exit(1)
          except Exception as e:
              print('列出 Gist 时异常：', e)
              sys.exit(1)

          today = datetime.date.today()
          deleted = 0
          failed = 0
          for g in gists:
              desc = g.get('description') or ''
              if '送货单' not in desc:
                  continue
              m = re.search(r'(\d{4}-\d{2}-\d{2})', desc)
              if not m:
                  continue
              try:
                  d = datetime.date.fromisoformat(m.group(1))
              except Exception:
                  continue
              if d < today:
                  req2 = urllib.request.Request(
                      'https://api.github.com/gists/' + g['id'],
                      headers=hdr, method='DELETE')
                  try:
                      with urllib.request.urlopen(req2):
                          pass
                      deleted += 1
                      print('deleted', g['id'], desc)
                  except urllib.error.HTTPError as e:
                      failed += 1
                      print('fail', g['id'], 'HTTP', e.code, e.reason)
                  except Exception as e:
                      failed += 1
                      print('fail', g['id'], e)
          print('done, deleted', deleted, ', failed', failed)
          sys.exit(1 if failed else 0)
          PY
